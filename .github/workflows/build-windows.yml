
name: Build VivaPlay for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Gerar instalador EXE
        run: npm run dist

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: VivaPlay-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
